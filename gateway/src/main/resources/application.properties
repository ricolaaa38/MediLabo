spring.application.name=gateway
server.port=8081
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.config.import=optional:configserver:

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

ui.url=${UI_URL}
patient.url=${PATIENT_URL}
note.url=${NOTE_URL}
evaluation.url=${EVALUATION_URL}

internal.secret=${INTERNAL_SECRET}

# Route ui-root
spring.cloud.gateway.routes[0].id=ui-root
spring.cloud.gateway.routes[0].uri=${ui.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/
spring.cloud.gateway.routes[0].filters[0]=SetPath=/ui

# Route ui
spring.cloud.gateway.routes[1].id=ui
spring.cloud.gateway.routes[1].uri=${ui.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/ui/**

# Route ui-static
spring.cloud.gateway.routes[2].id=ui-static
spring.cloud.gateway.routes[2].uri=${ui.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/css/**, /js/**, /images/**, /webjars/**

# Route patient
spring.cloud.gateway.routes[3].id=patient
spring.cloud.gateway.routes[3].uri=${patient.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/patients/**

# Route notes
spring.cloud.gateway.routes[4].id=notes
spring.cloud.gateway.routes[4].uri=${note.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notes/**

# Route evaluation
spring.cloud.gateway.routes[5].id=evaluation
spring.cloud.gateway.routes[5].uri=${evaluation.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/evaluations/**
